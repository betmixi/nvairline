<div class="container py-4">
  <a class="btn-back-home" routerLink="/">← Trang chủ</a>

  <h2 class="mb-1 mt-3">🛠️ Dịch vụ bổ trợ</h2>
  <p class="text-muted mb-4">Chọn một dịch vụ để đặt thêm cho vé đã mua.</p>

  <div class="service-grid">
    <a class="service-card" *ngFor="let service of services" [routerLink]="service.routerLink">
      <span class="service-icon">{{ service.icon }}</span>
      <span class="service-label">{{ service.label }}</span>
      <span class="service-desc">{{ service.description }}</span>
    </a>
  </div>
</div>
