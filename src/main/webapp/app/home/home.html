<div class="hero">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-6">
        <span class="badge bg-warning text-dark px-3 py-2 mb-3"> 🎉 Discover Amazing Events </span>

        <h1>
          Find The Best
          <span class="text-warning">Events</span>
          Around You
        </h1>

        <p class="mt-3">Explore concerts, conferences, workshops, exhibitions and thousands of exciting events happening every day.</p>

        <div class="search-box mt-4">
          <input class="form-control" placeholder="Search events..." />

          <button class="btn btn-warning">Search</button>
        </div>
      </div>

      <div class="col-lg-6 text-center">
        <img class="hero-image" src="https://images.unsplash.com/photo-1511578314322-379afb476865?w=900" />
      </div>
    </div>
  </div>
</div>

<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🔥 Popular Events</h2>

    <button class="btn btn-outline-primary" routerLink="/events">View All</button>
  </div>

  <div class="row g-4">
    <div class="col-lg-4 col-md-6" *ngFor="let event of events">
      <jhi-event-card [event]="event" />
    </div>
  </div>
</div>
