<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (report(); as reportRef) {
    <div>
      <h2 data-cy="reportDetailsHeading"><span jhiTranslate="dugxApp.report.detail.title">Report</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ reportRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.report.reason">Reason</span></dt>
        <dd>
          <span>{{ reportRef.reason }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.report.status">Status</span></dt>
        <dd>
          <span>{{ reportRef.status }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.report.createdDate">Created Date</span></dt>
        <dd>
          <span>{{ reportRef.createdDate | formatMediumDatetime }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.report.user">User</span></dt>
        <dd>
          <span>{{ reportRef.user?.login }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.report.event">Event</span></dt>
        <dd>
          @if (report()!.event) {
          <div>
            <a [routerLink]="['/event', report()!.event?.id, 'view']">{{ reportRef.event?.title }}</a>
          </div>
          }
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/report', reportRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
