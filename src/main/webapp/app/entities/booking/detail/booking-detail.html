<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (booking(); as bookingRef) {
    <div>
      <h2 data-cy="bookingDetailsHeading"><span jhiTranslate="dugxApp.booking.detail.title">Booking</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ bookingRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.booking.bookingDate">Booking Date</span></dt>
        <dd>
          <span>{{ bookingRef.bookingDate | formatMediumDatetime }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.booking.totalAmount">Total Amount</span></dt>
        <dd>
          <span>{{ bookingRef.totalAmount }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.booking.status">Status</span></dt>
        <dd>
          <span>{{ bookingRef.status }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.booking.user">User</span></dt>
        <dd>
          <span>{{ bookingRef.user?.login }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/booking', bookingRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
