@if (checkIn) {
<form name="deleteForm" (ngSubmit)="confirmDelete(checkIn.id!)">
  <div class="modal-header">
    <h4 class="modal-title" data-cy="checkInDeleteDialogHeading" jhiTranslate="entity.delete.title">Confirm delete operation</h4>
  </div>

  <div class="modal-body">
    <jhi-alert-error />
    <p id="jhi-delete-checkIn-heading" jhiTranslate="dugxApp.checkIn.delete.question" [translateValues]="{ id: checkIn.id }">
      Are you sure you want to delete Check In {{ checkIn.id }}?
    </p>
  </div>

  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" data-dismiss="modal" (click)="cancel()">
      <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancel</span>
    </button>

    <button id="jhi-confirm-delete-checkIn" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
      <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Delete</span>
    </button>
  </div>
</form>
}
