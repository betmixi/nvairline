<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (favorite(); as favoriteRef) {
    <div>
      <h2 data-cy="favoriteDetailsHeading"><span jhiTranslate="dugxApp.favorite.detail.title">Favorite</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ favoriteRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.favorite.user">User</span></dt>
        <dd>
          <span>{{ favoriteRef.user?.login }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.favorite.event">Event</span></dt>
        <dd>
          @if (favorite()!.event) {
          <div>
            <a [routerLink]="['/event', favorite()!.event?.id, 'view']">{{ favoriteRef.event?.title }}</a>
          </div>
          }
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/favorite', favoriteRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
