<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (auditLog(); as auditLogRef) {
    <div>
      <h2 data-cy="auditLogDetailsHeading"><span jhiTranslate="dugxApp.auditLog.detail.title">Audit Log</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ auditLogRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.auditLog.action">Action</span></dt>
        <dd>
          <span>{{ auditLogRef.action }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.auditLog.tableName">Table Name</span></dt>
        <dd>
          <span>{{ auditLogRef.tableName }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.auditLog.recordId">Record Id</span></dt>
        <dd>
          <span>{{ auditLogRef.recordId }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.auditLog.createdDate">Created Date</span></dt>
        <dd>
          <span>{{ auditLogRef.createdDate | formatMediumDatetime }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.auditLog.user">User</span></dt>
        <dd>
          <span>{{ auditLogRef.user?.login }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/audit-log', auditLogRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
