<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (organizer(); as organizerRef) {
    <div>
      <h2 data-cy="organizerDetailsHeading"><span jhiTranslate="dugxApp.organizer.detail.title">Organizer</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ organizerRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.organizer.companyName">Company Name</span></dt>
        <dd>
          <span>{{ organizerRef.companyName }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.organizer.taxCode">Tax Code</span></dt>
        <dd>
          <span>{{ organizerRef.taxCode }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.organizer.description">Description</span></dt>
        <dd>
          <span>{{ organizerRef.description }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.organizer.verified">Verified</span></dt>
        <dd>
          <span>{{ organizerRef.verified }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.organizer.user">User</span></dt>
        <dd>
          <span>{{ organizerRef.user?.login }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/organizer', organizerRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
