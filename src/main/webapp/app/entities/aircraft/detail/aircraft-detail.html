<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (aircraft(); as aircraftRef) {
    <div>
      <h2 data-cy="aircraftDetailsHeading"><span jhiTranslate="dugxApp.aircraft.detail.title">Aircraft</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ aircraftRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.aircraft.name">Name</span></dt>
        <dd>
          <span>{{ aircraftRef.name }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.aircraft.totalRows">Total Rows</span></dt>
        <dd>
          <span>{{ aircraftRef.totalRows }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.aircraft.totalColumns">Total Columns</span></dt>
        <dd>
          <span>{{ aircraftRef.totalColumns }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.aircraft.roomType">Room Type</span></dt>
        <dd>
          <span>{{ aircraftRef.roomType }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/aircraft', aircraftRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
