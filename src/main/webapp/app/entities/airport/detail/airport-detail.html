<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (airport(); as airportRef) {
    <div>
      <h2 data-cy="airportDetailsHeading"><span jhiTranslate="dugxApp.airport.detail.title">Sân bay</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ airportRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.airport.code">Mã sân bay</span></dt>
        <dd>
          <span>{{ airportRef.code }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.airport.name">Tên sân bay</span></dt>
        <dd>
          <span>{{ airportRef.name }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.airport.city">Thành phố</span></dt>
        <dd>
          <span>{{ airportRef.city }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/airport', airportRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
