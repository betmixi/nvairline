<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (venue(); as venueRef) {
    <div>
      <h2 data-cy="venueDetailsHeading"><span jhiTranslate="dugxApp.venue.detail.title">Venue</span></h2>

      <hr />

      <jhi-alert-error />

      <jhi-alert />

      <dl class="row-md jh-entity-details">
        <dt><span jhiTranslate="global.field.id">ID</span></dt>
        <dd>
          <span>{{ venueRef.id }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.venue.name">Name</span></dt>
        <dd>
          <span>{{ venueRef.name }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.venue.address">Address</span></dt>
        <dd>
          <span>{{ venueRef.address }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.venue.city">City</span></dt>
        <dd>
          <span>{{ venueRef.city }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.venue.country">Country</span></dt>
        <dd>
          <span>{{ venueRef.country }}</span>
        </dd>
        <dt><span jhiTranslate="dugxApp.venue.capacity">Capacity</span></dt>
        <dd>
          <span>{{ venueRef.capacity }}</span>
        </dd>
      </dl>

      <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
        <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Back</span>
      </button>

      <button type="button" [routerLink]="['/venue', venueRef.id, 'edit']" class="btn btn-primary">
        <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
      </button>
    </div>
    }
  </div>
</div>
