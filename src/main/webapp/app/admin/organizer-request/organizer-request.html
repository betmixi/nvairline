<div class="container mt-4">
  <h2>Organizer Requests</h2>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>#</th>
        <th>ID</th>

        <th>Company</th>

        <th>Tax Code</th>

        <th>Status</th>

        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      @for(item of organizers; track item.id){

      <tr>
        <td>{{ $index + 1 }}</td>
        <td>{{item.id}}</td>

        <td>{{item.companyName}}</td>

        <td>{{item.taxCode}}</td>

        <td>
          @if(item.status === 'PENDING') {
          <span class="badge bg-warning text-dark"> Pending </span>
          } @if(item.status === 'APPROVED') {
          <span class="badge bg-success"> Approved </span>
          } @if(item.status === 'REJECTED') {
          <span class="badge bg-danger"> Rejected </span>
          }
        </td>

        <td>
          <button class="btn btn-success btn-sm me-2" (click)="approve(item.id)">✓ Approve</button>

          <button class="btn btn-danger btn-sm" (click)="reject(item.id)">✕ Reject</button>
        </td>
      </tr>

      }
    </tbody>
  </table>
</div>
