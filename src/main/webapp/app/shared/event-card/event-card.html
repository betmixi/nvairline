<div class="event-card">
  <a [routerLink]="['/events', event.id]" class="card-media-link">
    @if (hasRoute()) {
    <div class="route-banner">
      <div class="route-line">
        <span class="airport-code">{{ getDepartureCode() }}</span>
        <span class="route-arrow">✈</span>
        <span class="airport-code">{{ getArrivalCode() }}</span>
      </div>
      <div class="route-cities">{{ getDepartureCity() }} → {{ getArrivalCity() }}</div>
    </div>
    } @if (event.banner) {
    <img class="event-image" [src]="event.banner" [alt]="event.title" />
    } @else {
    <div class="event-image event-image-placeholder">✈️</div>
    }
  </a>

  <div class="p-4">
    <span class="category"> {{ getCategory() }} </span>

    <h4 class="mt-3">
      <a class="event-title-link" [routerLink]="['/events', event.id]"> {{ event.title }} </a>
    </h4>

    <p class="text-muted mb-1">📍 {{ getLocation() }}</p>

    <p class="text-muted">🛫 {{ event.startTime?.format('DD/MM/YYYY HH:mm') }}</p>

    <div class="price-row">
      <div class="price">{{ getPrice() }}</div>

      <button class="btn btn-primary" [routerLink]="['/events', event.id]">Đặt vé</button>
    </div>
  </div>
</div>
