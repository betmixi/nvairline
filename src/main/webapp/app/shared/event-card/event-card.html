<div class="event-card">
  <a [routerLink]="['/events', event.id]">
    <img class="event-image" [src]="event.banner || 'content/images/logo-jhipster.png'" [alt]="event.title" />
  </a>

  <div class="p-4">
    <span class="category"> {{ getCategory() }} </span>

    <h4 class="mt-3">
      <a class="event-title-link" [routerLink]="['/events', event.id]"> {{ event.title }} </a>
    </h4>

    <p class="organizer text-muted mb-1">👤 {{ event.organizer?.companyName || 'Organizer' }}</p>

    <p class="text-muted mb-1">📍 {{ getLocation() }}</p>

    <p class="text-muted">🗓 {{ event.startTime?.format('DD/MM/YYYY HH:mm') }}</p>

    <div class="price-row">
      <div class="price">{{ getPrice() }}</div>

      <button class="btn btn-primary" [routerLink]="['/events', event.id]">Đặt vé</button>
    </div>
  </div>
</div>
