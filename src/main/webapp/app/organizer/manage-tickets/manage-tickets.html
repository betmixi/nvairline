<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2>🎟 Manage Tickets</h2>

      @if(event()){

      <p class="text-muted mb-0">
        Event :
        <strong>{{event()?.title}}</strong>
      </p>

      }
    </div>

    <button class="btn btn-success" (click)="finish()">Finish</button>
  </div>

  <!-- Create Ticket -->

  <div class="card shadow-sm mb-4">
    <div class="card-header">Add Ticket</div>

    <div class="card-body">
      <div class="row">
        <div class="col-md-4">
          <label class="form-label"> Ticket Name </label>

          <input class="form-control" [(ngModel)]="newTicket.name" />
        </div>

        <div class="col-md-4">
          <label class="form-label"> Price </label>

          <input type="number" class="form-control" [(ngModel)]="newTicket.price" />
        </div>

        <div class="col-md-4">
          <label class="form-label"> Quantity </label>

          <input type="number" class="form-control" [(ngModel)]="newTicket.quantity" />
        </div>
      </div>

      <div class="mt-4">
        <button class="btn btn-primary" (click)="saveTicket()">➕ Add Ticket</button>
      </div>
    </div>
  </div>

  <!-- Ticket List -->

  <div class="card shadow-sm">
    <div class="card-header">Ticket List</div>

    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead>
          <tr>
            <th>Name</th>

            <th>Price</th>

            <th>Quantity</th>

            <th>Remaining</th>

            <th width="120">Action</th>
          </tr>
        </thead>

        <tbody>
          @for(ticket of tickets();track ticket.id){

          <tr>
            <td>{{ticket.name}}</td>

            <td>{{ticket.price | number}}</td>

            <td>{{ticket.quantity}}</td>

            <td>{{ticket.remaining}}</td>

            <td>
              <button class="btn btn-sm btn-danger" (click)="delete(ticket)">Delete</button>
            </td>
          </tr>

          }
        </tbody>
      </table>
    </div>
  </div>
</div>
