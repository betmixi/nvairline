<div class="app-shell" [class.hide-navbar]="isAuthRoute()">
  <router-outlet name="navbar" />

  <div class="app-content">
    @if (isAdminRoute()) {
    <jhi-admin-shell />
    }
    <div class="container-fluid" [class.full-bleed]="isFullBleedRoute() || isAuthRoute()" [class.admin-page-container]="isAdminRoute()">
      <div class="card jh-card" [class.full-bleed]="isFullBleedRoute() || isAuthRoute()">
        <router-outlet />
      </div>
    </div>
  </div>
</div>
